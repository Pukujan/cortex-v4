name: Cortex secretless full suite

on:
  pull_request:
  push:
    branches:
      - master
      - "agent/**"

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORTEX_SSC_CONTRACT_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Materialize secretless SSC contract fixture
        run: python scripts/materialize_ssc_contract_fixture.py

      - name: Validate SSC contract fixture
        run: python scripts/validate_ssc_contract.py --root 'D:\claude\stupidly-simple-cortex'

      - name: Run full Cortex suite
        run: python -m pytest tests -q
